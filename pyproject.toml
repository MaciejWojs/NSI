[project]
name = "nsi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*.test.py"]
python_functions = ["test_*"]
addopts = [
    "--cov=API",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["API.py"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
precision = 1

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
